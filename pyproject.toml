[project]
name = "another-fastapi-template"
version = "1.1.0"
description = "This template provides a basic setup for a FastAPI application."
authors = [{ name = "Jose Cerrejon", email = "ulysess@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.160.0",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx2>=2.16.0",
]

[tool.uv]
# Transitive dep floor: fixes CVE-2026-63374, CVE-2026-63349, CVE-2026-64847
constraint-dependencies = ["anyio>=4.14.2"]

[tool.pytest]
pythonpath = ["."]