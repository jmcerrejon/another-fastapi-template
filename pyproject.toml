[project]
name = "another-fastapi-template"
version = "1.1.0"
description = "This template provides a basic setup for a FastAPI application."
authors = [{ name = "Jose Cerrejon", email = "ulysess@gmail.com" }]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "fastapi>=0.137.1",
    "uvicorn>=0.49.0",
    "sqlalchemy>=2.0.51",
    "pytest>=9.1.0",
    "httpx2>=2.4.0",
]

[tool.pytest]
pythonpath = ["."]